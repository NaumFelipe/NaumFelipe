name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        run: |
          curl -o profile/langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=NaumFelipe&layout=compact&langs_count=5&theme=dark&hide_border=true&bg_color=0d1117"

      - name: Commit cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README cards"
